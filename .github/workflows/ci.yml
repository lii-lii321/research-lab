name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint (ruff) and type-check (mypy)
        if: matrix.python-version == '3.10'
        run: |
          ruff check .
          mypy
      - name: Run tests with coverage gate
        run: pytest -q -rs --cov=services --cov-report=term --cov-fail-under=85

  package:
    # 打包验证：pyproject 安装路径可用，且安装后的包在源码树外可导入
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Import check outside source tree
        run: |
          cd "$RUNNER_TEMP"
          python -c "import routers, services, ui, utils, models; import cli; print('imports ok')"
          research-lab --version
      - name: Run tests against installed package
        run: pytest -q

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate sample data
        run: python scripts/generate_sample.py
      - name: API and UI smoke (real servers, live probes)
        run: python scripts/smoke_check.py
