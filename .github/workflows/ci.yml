name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint (ruff) and type-check (mypy)
        run: |
          ruff check .
          mypy
      - name: Run tests with coverage gate
        run: pytest -q -rs --cov=services --cov-report=term --cov-fail-under=85

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate sample data
        run: python scripts/generate_sample.py
      - name: API and UI smoke (real servers, live probes)
        run: python scripts/smoke_check.py

