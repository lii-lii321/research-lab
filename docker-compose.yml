services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      RESEARCH_LAB_DB: /app/data/tracking/experiments.db
      RESEARCH_LAB_CORS: http://localhost:8501,http://127.0.0.1:8501
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  ui:
    build: .
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./data:/app/data
    environment:
      RESEARCH_LAB_DB: /app/data/tracking/experiments.db
    env_file:
      - path: .env
        required: false
    depends_on:
      - api
