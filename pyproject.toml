[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-lab"
description = "AI Data Research Lab — CSV 一键到可复现研究报告（画像 → 研究问题 → 实验执行 → ML 基线 → 文献 → 报告）"
readme = "README.md"
requires-python = ">=3.10"
# 版本单一来源：utils/version.py（main.py、报告 MANIFEST、CLI 均引用此处）
dynamic = ["version"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "streamlit>=1.36",
    "pydantic>=2.6",
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "statsmodels>=0.14.1",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "joblib>=1.3",
    "plotly>=5.20",
    "matplotlib>=3.8",
    "fpdf2>=2.7",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
research-lab = "cli:main"

[tool.setuptools]
# 应用型仓库：显式列出可导入包，页面前端 pages/ 与数据目录不入包
packages = ["routers", "services", "ui", "utils", "models"]
py-modules = ["cli"]

[tool.setuptools.dynamic]
version = { attr = "utils.version.APP_VERSION" }
